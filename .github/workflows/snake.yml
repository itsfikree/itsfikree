# Kode generate animasi snake untuk github
# Kode ini dibuat saat seharusnya aku mengubah kode skripsi
# Tetapi aku malah belajar github :)
# TODO: Mengerjakan skripsi, bukan belajar github!
name: Generate Snake Animation

on:
  schedule:
    # Berjalan otomatis setiap hari pukul 00:00 UTC
    - cron: "0 0 * * *"
  # Agar bisa dijalankan manual lewat tombol di GitHub
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=9c0000&color_dots=#ebedf0,#bae6fd,#7dd3fc,#0284c7,#0369a1
            dist/github-snake-dark.svg?palette=github-dark&color_snake=f97316&color_dots=#161b22,#1e3a8a,#1d4ed8,#3b82f6,#38bdf8
                
            # dist/github-snake.svg
            # dist/github-snake-dark.svg?palette=github-dark

      - name: Push github-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}